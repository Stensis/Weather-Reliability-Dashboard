name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEATHER_AI_API_KEY: ${{ secrets.WEATHER_AI_API_KEY }}
      WEATHER_AI_BASE_URL: https://api.weather-ai.co

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run API and UI automation
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload generated dashboard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: public/test-summary.json
          retention-days: 14
